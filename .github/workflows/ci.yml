name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv & install (pyproject)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Unit tests
        run: |
          .venv/bin/python -m pytest

      - name: Smoke test installed core CLI
        run: |
          .venv/bin/python -m pip show spreadsheet-handling
          test -x .venv/bin/sheets-run
          .venv/bin/sheets-run --help >/dev/null
          