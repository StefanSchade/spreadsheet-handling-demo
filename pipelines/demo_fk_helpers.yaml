# pipelines/demo_fk_helpers.yaml
io:
  input:  { kind: json_dir, path: ./data/branches_minimal }
  output: { kind: xlsx,     path: ./tmp/branches_with_helpers.xlsx }

pipeline:
  - step: validate
    defaults:
      id_field: id
      label_field: name
      detect_fk: true
      helper_prefix: "_"

  # `infer_fk_relations` writes the v2 relation policy that the FK-helper
  # primitives consume; `add_fk_helpers` no longer infers relations from
  # column names.
  - step: infer_fk_relations
    mode: naming_convention
    id_columns: [id]
    fk_patterns:
      - "id_({target})"
    target_label_fields: [name]

  - step: add_fk_helpers

  - step: flatten_headers
    mode: level0

  - step: reorder_fk_helpers
