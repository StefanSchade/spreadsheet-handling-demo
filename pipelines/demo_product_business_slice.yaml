io:
  input:  { kind: json_dir, path: ./data/product_business_slice }
  output: { kind: xlsx,     path: ./tmp/product_business_slice.xlsx }

excel:
  auto_filter: true
  freeze_header: true
  header_fill_rgb: DDDDDD

pipeline:
  - step: apply_overrides
    overrides_path: ./data/product_business_slice/overrides.yaml

  - step: validate
    mode_duplicate_ids: warn
    mode_missing_fk: warn
    defaults:
      id_field: id
      label_field: name
      detect_fk: true
      helper_prefix: "_"

  - step: add_validations
    rules:
      - sheet: product
        column: status
        rule:
          type: in_list
          values: [active, pilot, retired]
      - sheet: product
        column: category
        rule:
          type: in_list
          values: [entry, standard, premium]
      - sheet: branch
        column: country
        rule:
          type: in_list
          values: [DE, CH, AT]

  - step: add_fk_helpers
    defaults:
      id_field: id
      label_field: name
      detect_fk: true
      helper_prefix: "_"

  - step: reorder_fk_helpers
    helper_prefix: "_"

  - step: flatten_headers
    mode: level0
